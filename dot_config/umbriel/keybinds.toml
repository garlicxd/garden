# ─────────────────────────────── Keybinds ────────────────────────────────────
# Ported from niri keybinds.kdl. Chord → action; configured chords REPLACE
# matching built-ins, unlisted built-ins stay active (e.g. Mod+1..9 switch
# workspaces, Mod+Shift+1..9 move the focused window, keypad digits).
# Docs: https://docs.noctalia.dev/umbriel/keybinds/
#       https://docs.noctalia.dev/umbriel/actions/
# ─────────────────────────────────────────────────────────────────────────────

[keybinds]

# Applications and session

"Mod+Return" = "spawn:kitty"                            # $TERMINAL
"Mod+E" = "spawn:nautilus"                              # $FILE_MANAGER
"Mod+B" = "spawn:brave-origin"                          # $BROWSER

"Mod+Q" = "window-close"
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+MouseRight" = "layout-scroll-drag"

# ─── (Noctalia) ───
"Mod" = "spawn:noctalia msg panel-toggle launcher"
"Mod+Z" = "spawn:noctalia msg panel-toggle launcher /emo"
"Mod+V" = "spawn:noctalia msg panel-toggle clipboard"
"Mod+W" = "spawn:noctalia msg panel-toggle wallpaper"
"Mod+N" = "spawn:noctalia msg panel-toggle noctalia/notes:panel"
"Mod+X" = "spawn:noctalia msg bar-toggle"
"Mod+Escape" = "spawn:noctalia msg panel-toggle session"

# Shift+Print (niri screenshot-window) dropped: neither Noctalia msg nor Umbriel
# exposes a window-only capture; region/fullscreen cover the workflow.
"Print" = "spawn:noctalia msg screenshot-region"
"Ctrl+Print" = "spawn:noctalia msg screenshot-fullscreen"
"Alt+Print" = "spawn:noctalia msg screenshot-fullscreen pick"

# Focus navigation. In overview, Mod+Up/Down retain normal layout focus, so they
# traverse stacks in the default horizontal layout. Bare Up/Down move between
# workspace rows.
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"

# Window state and layout
"Mod+T" = "window-toggle-floating"
"Mod+Shift+T" = "window-focus-switch-floating"
"Mod+P" = "window-toggle-pinned"
"Mod+M" = "window-toggle-maximize-to-edges"

# Common keybinds
# "Mod+Escape" = "session-quit"
# Keep one escape binding available when a game or remote desktop client asks
# Umbriel to pass ordinary compositor shortcuts through.
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Shift+Ctrl+Escape" = "session-quit"
"Mod+F1" = "window-focus-next"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"
"Mod+Ctrl+F" = "window-toggle-fullscreen"             # Exit restores the previous layout size immediately
"Mod+F" = "window-toggle-maximize"
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Comma" = "window-consume-left"
"Mod+Period" = "window-consume-right"
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"

# Workspaces. Bare digits are positions on the output under the pointer.
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"
# Quote an all-digit name to distinguish it from a position.
# "Mod+Ctrl+2" = 'workspace-switch:"2"/DP-2'

# Scratchpads
# These bare actions use the implicit `default` scratchpad because no named
# definitions are active above. A scratchpad is global: toggling it summons all
# its windows to the output under the pointer. Only outputs with a visible
# scratchpad receive its dim and blur backdrop.
# Resize, maximize, fullscreen, and close actions target a scratchpad that owns
# keyboard focus. Layout-relative window actions leave the workspace behind it
# unchanged.
# Parented dialogs, including portal file choosers from another process, join a
# visible parent window's scratchpad unless an explicit placement rule wins.
# `window-focus:<window-id>` and `window-focus-warp:<window-id>` also summon a
# hidden scratchpad target to the output under the pointer. The first form
# follows `input.cursor.follows_focus`; the `-warp` form always moves the cursor.
# Documentation: https://docs.noctalia.dev/umbriel/scratchpads/
"Mod+Shift+Space" = "window-move-to-scratchpad"
"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = "window-restore-from-scratchpad"
"Mod+Tab" = "scratchpad-focus-next"

# Named mode recipe: uncomment the definitions above, then replace the four
# action values with named forms such as these. Every scratchpad action needs a
# configured name once named mode is active.
# "Mod+Shift+Space" = "window-move-to-scratchpad:terminal"
# "Mod+Space" = "scratchpad-toggle:terminal"
# "Mod+Ctrl+Space" = "window-restore-from-scratchpad:terminal"
# "Mod+Tab" = "scratchpad-focus-next:terminal"
# "Mod+Ctrl+Shift+M" = "window-toggle-scratchpad:music"
# "Mod+Ctrl+M" = "scratchpad-toggle:music"

