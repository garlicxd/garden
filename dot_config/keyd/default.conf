[ids]
*

[main]
capslock = leftshift
leftshift = leftcontrol
leftcontrol = escape
leftmeta = layer(meta)

# Super+J toggles stardew_mode; other Super shortcuts still work (M = meta modifier)
[meta:M]
j = toggle(stardew_mode)

# Stardew animation-cancel engine.
# keyd v2.6.0 holds keys using an inline timeval inside a "+" group:
#   key+20ms = key down, wait 20ms, key up
# macro2(<first gap>, <repeat gap>, macro(...)):
#   runs immediately, then repeats after run+gap (0 disables repeat).
#
# Cycle (210ms):
#   t=  0  c down
#   t= 20  c up                (>= 1 game tick)
#   t=155  rightshift+delete+r down   (135ms hit window)
#   t=175  rightshift+delete+r up     (20ms hold)
#   t=210  next c down          (35ms recovery gap)
# (An in-group timeval's pseudo-release is filtered by keyd's keystate check,
#  so no spurious key-up is emitted.)
[stardew_mode]
space = macro2(35, 35, macro(c+20ms 135ms rightshift+r+delete+20ms))
